---
images:
  tags:
    cyborg_api: "ghcr.io/rackerlabs/genestack-images/cyborg:2025.1-latest"
    cyborg_agent: "ghcr.io/rackerlabs/genestack-images/cyborg:2025.1-latest"
    cyborg_db_sync: "ghcr.io/rackerlabs/genestack-images/cyborg:2025.1-latest"
    cyborg_conductor: "ghcr.io/rackerlabs/genestack-images/cyborg:2025.1-latest"
    bootstrap: "ghcr.io/rackerlabs/genestack-images/openstack-client:latest"
    db_drop: "ghcr.io/rackerlabs/genestack-images/openstack-client:latest"
    db_init: "ghcr.io/rackerlabs/genestack-images/openstack-client:latest"
    dep_check: "ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:latest"
    ks_endpoints: "ghcr.io/rackerlabs/genestack-images/openstack-client:latest"
    ks_service: "ghcr.io/rackerlabs/genestack-images/openstack-client:latest"
    ks_user: "ghcr.io/rackerlabs/genestack-images/openstack-client:latest"

endpoints:
  hardware:
    hosts:
      public: cyborg-api
  oslo_db:
    host_fqdn_override:
      default: mariadb-cluster-primary.openstack.svc.cluster.local
    hosts:
      default: mariadb-cluster-primary
  oslo_messaging:
    hosts:
      default: rabbitmq-nodes
    host_fqdn_override:
      default: rabbitmq.openstack.svc.cluster.local
  oslo_cache:
    hosts:
      default: memcached
    host_fqdn_override:
      default: memcached.openstack.svc.cluster.local
  fluentd:
    namespace: fluentbit

dependencies:
  static:
    api:
      jobs:
        - cyborg-db-sync
        - cyborg-ks-user
        - cyborg-ks-endpoints
        - cyborg-ks-service
    agent:
      jobs:
        - cyborg-db-sync
        - cyborg-ks-user
        - cyborg-ks-endpoints
        - cyborg-ks-service
    db_sync:
      jobs: null

conf:
  cyborg:
    DEFAULT:
      enable_notification_events: true
      notification_format: versioned
    cache:
      enabled: true
      backend: dogpile.cache.memcached
    database:
      connection_debug: 0
      connection_recycle_time: 600
      connection_trace: true
      idle_timeout: 3600
      mysql_sql_mode: {}
      use_db_reconnect: true
      pool_timeout: 60
      max_retries: -1
    keystone_authtoken:
      service_token_roles: service
      service_token_roles_required: true
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
      service_type: conductor
    oslo_middleware:
      enable_proxy_headers_parsing: true
    oslo_messaging_rabbit:
      amqp_durable_queues: false
      rabbit_ha_queues: false
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: false
      use_queue_manager: false
      rabbit_interval_max: 10
      heartbeat_rate: 3
      heartbeat_timeout_threshold: 60
      heartbeat_in_pthread: true
      kombu_reconnect_delay: 0.5
    oslo_messaging_notifications:
      driver: messagingv2
      topics:
        - notifications
  logging:
    logger_root:
      handlers:
        - stdout
      level: INFO

manifests:
  ingress_api: false
  job_rabbit_init: false
  service_ingress_api: false
  job_db_init: false
  job_ks_service: true
